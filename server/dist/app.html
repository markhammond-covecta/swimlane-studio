<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swimlane diagram</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --btn-bg: rgba(255, 255, 255, 0.92);
        --btn-fg: #222;
        --btn-bd: rgba(0, 0, 0, 0.15);
      }
      html.dark {
        --bg: #1e1e1e;
        --fg: #e8e8e8;
        --btn-bg: rgba(45, 45, 45, 0.92);
        --btn-fg: #eee;
        --btn-bd: rgba(255, 255, 255, 0.2);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      #root {
        position: relative;
      }
      .viewport {
        position: relative;
        width: 100%;
        height: 440px;
        overflow: hidden;
        background: var(--bg);
        touch-action: none;
        cursor: grab;
        user-select: none;
      }
      html.fullscreen .viewport {
        height: 100vh;
      }
      .viewport.dragging {
        cursor: grabbing;
      }
      .canvas {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
        will-change: transform;
      }
      .canvas svg {
        display: block;
      }
      .controls {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        gap: 4px;
        z-index: 2;
      }
      .controls button {
        width: 28px;
        height: 28px;
        padding: 0;
        border-radius: 6px;
        border: 1px solid var(--btn-bd);
        background: var(--btn-bg);
        color: var(--btn-fg);
        font: 15px/1 -apple-system, system-ui, sans-serif;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      }
      .controls button:hover {
        filter: brightness(0.95);
      }
      .controls button[hidden] {
        display: none;
      }
      .msg {
        margin: 0;
        padding: 12px;
        white-space: pre-wrap;
        opacity: 0.7;
      }
    </style>
  </head>
